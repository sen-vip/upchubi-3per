<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08756C" />

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>업추비 3% | 업무추진비 편성 체크</title>
  <style>
:root {
  font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #1F2937;
  background: #F5F7F8;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --primary: #08756c;
  --primary-dark: #075b55;
  --soft: #eef7f5;
  --border: #e3e7ec;
  --text: #1f2937;
  --muted: #667085;
  --ok: #08775a;
  --danger: #b83832;
  --white: #ffffff;
  --shadow: 0 12px 28px rgba(15, 23, 42, 0.055);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: #f5f7f8; color: var(--text); font-size: 16px; }
button, input { font: inherit; }
button { color: inherit; }
svg { display: block; }

.page-shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 36px; }
.topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(227, 231, 236, .95); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--primary-dark); font-weight: 800; text-decoration: none; letter-spacing: -.02em; }
.brand-mark { width: 35px; height: 35px; color: var(--primary); }
.ghost-button { min-height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,.78); color: #475467; font-size: 13px; font-weight: 700; cursor: pointer; }
.ghost-button:hover { border-color: #cbd3dc; background: white; }

main { padding-top: 56px; }
.hero { max-width: 720px; margin-bottom: 30px; }
.hero-kicker { margin-bottom: 12px; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.hero h1 { margin: 0; font-size: clamp(34px, 5vw, 52px); line-height: 1.08; letter-spacing: -.045em; }
.hero h1 span { color: var(--primary); }
.hero p { margin: 15px 0 0; color: var(--muted); font-size: 17px; line-height: 1.7; letter-spacing: -.02em; }
.scope-note { width: 100%; margin-top: 16px; padding: 13px 15px; border: 1px solid #d9e1e7; border-radius: 12px; background: #eef7f5; color: #344054; font-size: 15px; line-height: 1.72; word-break: keep-all; overflow-wrap: normal; }
.scope-note strong { color: var(--primary-dark); }

.path-card { display: grid; grid-template-columns: 44px 1fr; gap: 17px; margin: 0 0 38px; padding: 22px 24px; border: 1px solid var(--border); border-radius: 18px; background: linear-gradient(135deg, #fafbfc, #ffffff); box-shadow: 0 4px 16px rgba(15, 23, 42, .035); }
.path-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: var(--primary); background: #eef7f5; }
.path-icon svg, .drop-icon svg, .privacy-note svg, .criteria-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.path-heading-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.path-heading-row h2 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
.path-badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; background: #e7f4f1; color: var(--primary-dark); font-size: 11px; font-weight: 800; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 10px; color: #667085; font-size: 14px; line-height: 1.7; }
.breadcrumb b { color: #98a2b3; font-weight: 700; }
.breadcrumb strong { color: var(--primary-dark); font-weight: 800; }
.download-tabs { display: flex; gap: 10px 24px; flex-wrap: wrap; margin-top: 13px; }
.download-tabs > div { display: inline-flex; align-items: center; gap: 8px; color: #667085; font-size: 13px; }
.tab-chip { padding: 5px 9px; border: 1px solid #dbe2e8; border-radius: 8px; background: white; color: var(--primary-dark); font-weight: 800; }

.upload-section { padding-top: 2px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 16px; }
.section-heading > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.section-step { display: inline-flex; min-width: 34px; height: 24px; padding: 0 8px; align-items: center; justify-content: center; border-radius: 7px; background: #eef7f5; color: var(--primary-dark); font-size: 11px; font-weight: 900; letter-spacing: .04em; }
.section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
.section-heading p { margin: 0; max-width: 520px; color: var(--muted); font-size: 13px; line-height: 1.62; text-align: right; word-break: keep-all; overflow-wrap: normal; }

.upload-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.upload-card { padding: 18px; border: 1px solid #e3e7ec; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
.upload-card-head { display: flex; align-items: center; gap: 11px; padding: 2px 2px 14px; }
.upload-number { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #eef7f5; color: var(--primary); font-weight: 900; font-size: 13px; }
.upload-card h3 { margin: 0; font-size: 16px; letter-spacing: -.025em; }
.upload-card-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.drop-zone { min-height: 162px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; border: 1.5px dashed #cbd8d5; border-radius: 14px; background: #fbfcfd; color: #5f6b7a; cursor: pointer; transition: border-color .18s ease, background .18s ease, transform .18s ease; outline: none; }
.drop-zone:hover, .drop-zone:focus-visible, .drop-zone.is-dragging { border-color: var(--primary); background: #f6faf9; }
.drop-zone.is-dragging { transform: translateY(-2px); }
.drop-zone.is-loading { opacity: .68; pointer-events: none; }
.drop-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #eef7f5; color: var(--primary); }
.drop-zone strong { color: #344054; font-size: 14px; }
.drop-zone > span { font-size: 11px; color: #8b95a5; }
.file-status { min-height: 0; margin-top: 12px; }
.status-ok { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 11px; border-radius: 11px; background: #f6faf9; }
.status-check { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #e6f4ef; color: var(--ok); font-weight: 900; }
.status-ok div { min-width: 0; }
.status-ok strong { display: block; color: #344054; font-size: 12px; }
.status-ok span:last-child { display: block; margin-top: 2px; color: #667085; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.privacy-note { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 14px 0 0; color: #667085; font-size: 11.5px; }
.privacy-note svg { width: 15px; height: 15px; }

.message-area { margin-top: 14px; }
.notice { padding: 12px 14px; border: 1px solid #e3e7ec; border-radius: 11px; background: #fff; color: #5f6b7a; font-size: 13px; line-height: 1.55; }
.notice.error { border-color: #efd0cd; background: #fff7f6; color: #a1433d; }
.notice.info { border-color: #dbe5e2; background: #f6faf9; color: #3f5f59; }

.result-section { scroll-margin-top: 16px; margin-top: 52px; }
.is-hidden { display: none !important; }
.result-heading { margin-bottom: 18px; }
.result-hero { position: relative; padding: 26px 28px 24px; border: 1px solid #e3e7ec; border-radius: 20px; background: linear-gradient(145deg, #ffffff 0%, #fafbfc 100%); box-shadow: 0 14px 36px rgba(15, 23, 42, .065); overflow: hidden; }
.result-hero::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; top: -100px; right: -65px; background: rgba(20, 125, 115, .055); }
.result-hero.over { border-color: #ecc8c5; background: linear-gradient(145deg, #fff 0%, #fff8f7 100%); }
.result-hero.over::after { background: rgba(200, 75, 69, .055); }
.result-topline { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; color: #667085; font-size: 13px; font-weight: 800; }
.verdict { padding: 6px 10px; border-radius: 999px; background: #e7f4f0; color: var(--ok); font-size: 12px; }
.over .verdict { background: #fbe6e4; color: var(--danger); }
.result-ratio { position: relative; z-index: 1; margin-top: 14px; color: var(--primary-dark); font-size: clamp(56px, 8vw, 78px); line-height: 1; font-weight: 850; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.over .result-ratio { color: #a63f39; }
.result-ratio small { margin-left: 6px; font-size: .37em; font-weight: 800; letter-spacing: -.02em; }
.result-summary { position: relative; z-index: 1; margin: 13px 0 21px; color: #667085; font-size: 14px; line-height: 1.62; word-break: keep-all; overflow-wrap: normal; }
.result-summary strong { color: #344054; }
.over .result-summary strong { color: var(--danger); }
.progress-wrap { position: relative; z-index: 1; max-width: 620px; }
.progress-track { position: relative; height: 8px; border-radius: 999px; background: #e7ebef; overflow: hidden; }
.progress-fill { height: 100%; border-radius: inherit; background: var(--primary); }
.over .progress-fill { background: var(--danger); }
.progress-labels { display: flex; justify-content: space-between; margin-top: 7px; color: #8b95a5; font-size: 10px; font-variant-numeric: tabular-nums; }
.rounding-warning { position: relative; z-index: 1; margin: 13px 0 0; padding-top: 12px; border-top: 1px solid #f0d9d7; color: #9b4b45; font-size: 12px; line-height: 1.55; }

.metrics-card { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; padding: 6px 0; border: 1px solid #e3e7ec; border-radius: 16px; background: #fff; }
.metric { min-width: 0; padding: 18px 22px; border-right: 1px solid #eef1f4; }
.metric:last-child { border-right: 0; }
.metric span { display: block; color: #667085; font-size: 12px; font-weight: 700; }
.metric strong { display: block; margin-top: 7px; color: #344054; font-size: clamp(18px, 2.3vw, 24px); letter-spacing: -.035em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric small { display: block; margin-top: 4px; color: #7a8594; font-size: 11px; text-align: right; }
.metric.featured strong { color: var(--primary-dark); }

.formula-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; padding: 13px 16px; border-radius: 12px; background: #f1f3f5; color: #667085; }
.formula-card span { font-size: 11px; font-weight: 800; }
.formula-card strong { color: #475467; font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
.details-stack { display: grid; gap: 10px; margin-top: 22px; }
details { border: 1px solid #e3e7ec; border-radius: 14px; background: #fff; overflow: hidden; }
summary { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary > span:first-child { min-width: 0; }
summary strong { display: block; font-size: 14px; }
summary small { display: block; margin-top: 4px; color: #7a8594; font-size: 11.5px; }
.summary-action { flex: 0 0 auto; color: var(--primary); font-size: 11px; font-weight: 800; }
details[open] .summary-action { font-size: 0; }
details[open] .summary-action::after { content: '접기'; font-size: 11px; }
.detail-body { padding: 0 18px 18px; border-top: 1px solid #eef1f4; }
.detail-table { padding-top: 6px; }
.detail-row { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; min-height: 43px; border-bottom: 1px solid #eef1f4; font-size: 12.5px; }
.detail-row span { color: #667085; }
.detail-row strong { color: #344054; font-variant-numeric: tabular-nums; text-align: right; }
.detail-row.total { min-height: 50px; border-bottom: 0; }
.detail-row.total span, .detail-row.total strong { color: var(--primary-dark); font-weight: 900; }
.detail-note { margin: 4px 0 0; padding: 11px 12px; border-radius: 10px; background: #f6f7f9; color: #667085; font-size: 11.5px; line-height: 1.6; }
.expense-detail { padding-top: 14px; }
.rule-line { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start; padding: 10px 0; font-size: 12px; }
.rule-line + .rule-line { border-top: 1px solid #eef1f4; }
.rule-line span { width: 44px; min-height: 24px; display: inline-grid; place-items: center; border-radius: 7px; font-size: 10px; font-weight: 900; }
.rule-line.include span { background: #e8f5f1; color: var(--ok); }
.rule-line.exclude span { background: #f5f0ef; color: #8b6966; }
.rule-line strong { color: #475467; line-height: 1.65; }


.result-guidance {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  margin-top: 16px;
  padding: 16px 18px;
  border: 1px solid #ead9b9;
  border-radius: 14px;
  background: #fffbf2;
  color: #465166;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
}
.result-guidance .guidance-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #fff5df;
  color: #a95f00;
  font-size: 13px;
  font-weight: 900;
}
.result-guidance strong {
  display: block;
  margin-bottom: 4px;
  color: #7a4b00;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.45;
  word-break: keep-all;
}
.result-guidance p {
  margin: 0;
  color: #5b5242;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.72;
  word-break: keep-all;
  overflow-wrap: normal;
}

.criteria-card { margin-top: 42px; border: 1px solid #e3e7ec; border-radius: 16px; background: rgba(255,255,255,.78); overflow: hidden; }
.criteria-toggle { width: 100%; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 18px; border: 0; background: transparent; cursor: pointer; }
.criteria-toggle > span { display: flex; align-items: center; gap: 10px; text-align: left; }
.criteria-toggle strong { font-size: 13px; }
.criteria-toggle svg { width: 18px; height: 18px; color: #7a8594; transition: transform .18s ease; }
.criteria-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.criteria-body { display: grid; grid-template-columns: 1.25fr .75fr; gap: 34px; padding: 20px 20px 22px; border-top: 1px solid #eceff2; }
.criteria-body h3 { margin: 0 0 6px; font-size: 13px; }
.criteria-body p { margin: 0; color: #667085; font-size: 11.5px; line-height: 1.65; }
.help-callout, .criteria-body p, .detail-note { word-break: keep-all; overflow-wrap: normal; }
.criteria-body .muted { margin-top: 8px; color: #8b7e7c; }
.pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pill-list span { padding: 5px 8px; border: 1px solid #e3e7ec; border-radius: 8px; background: #fff; color: #667085; font-size: 10.5px; }

footer { display: flex; justify-content: space-between; margin-top: 42px; padding: 20px 2px 4px; border-top: 1px solid #e3e7ec; color: #8a94a3; font-size: 10.5px; }

.app-title { display: inline-flex; align-items: center; gap: 11px; min-width: 0; color: var(--primary-dark); }
.app-title-copy { display: grid; gap: 2px; min-width: 0; }
.app-title-copy strong { font-size: 17px; line-height: 1.15; letter-spacing: -.03em; }
.app-title-copy small { color: #667085; font-size: 10.5px; font-weight: 700; letter-spacing: -.01em; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.version-badge { display: inline-flex; align-items: center; min-height: 30px; padding: 0 9px; border: 1px solid #e3e7ec; border-radius: 999px; background: #f7f8fa; color: #667085; font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.help-button { color: var(--primary-dark); background: #f8fafb; border-color: #dbe5e2; }
.compact-hero { max-width: 790px; margin-bottom: 26px; }
.compact-hero h1 { font-size: clamp(30px, 4.4vw, 45px); }
body.modal-open { overflow: hidden; }
.modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 22px; background: rgba(17, 24, 39, .46); backdrop-filter: blur(4px); }
.help-modal { width: min(920px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column; border: 1px solid #e2e7ec; border-radius: 22px; background: #fff; box-shadow: 0 28px 70px rgba(15, 23, 42, .20); overflow: hidden; }
.help-modal-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 22px 17px; border-bottom: 1px solid #eef1f4; }
.help-eyebrow { display: block; margin-bottom: 4px; color: var(--primary); font-size: 10.5px; font-weight: 900; letter-spacing: .08em; }
.help-modal-head h2 { margin: 0; font-size: 20px; letter-spacing: -.035em; }
.icon-button { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid #e2e7ec; border-radius: 11px; background: #f8fbfa; color: #667085; font-size: 24px; line-height: 1; cursor: pointer; }
.icon-button:hover { background: #f4f7f8; color: var(--primary-dark); }
.help-modal-body { flex: 1 1 auto; overflow: auto; padding: 6px 22px 10px; }
.help-section { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 15px; padding: 20px 0; border-bottom: 1px solid #eef1f4; }
.help-section:last-child { border-bottom: 0; }
.help-step { width: 36px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: #eef7f5; color: var(--primary-dark); font-size: 10px; font-weight: 900; letter-spacing: .05em; }
.help-section h3 { margin: 1px 0 8px; font-size: 15px; letter-spacing: -.025em; }
.help-section p { margin: 0; color: #667085; font-size: 12.5px; line-height: 1.7; }
.help-path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 11px 0; padding: 11px 12px; border-radius: 10px; background: #f6f8fa; color: #5f6b7a; font-size: 12px; line-height: 1.7; }
.help-path b { color: #98a2b3; }
.help-path strong { color: var(--primary-dark); }
.help-file-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.help-file-grid > div { display: grid; gap: 3px; padding: 11px 12px; border: 1px solid #e3e7ec; border-radius: 11px; background: #fff; }
.help-file-grid strong { color: #344054; font-size: 12px; }
.help-file-grid span { color: #7a8594; font-size: 10.5px; }
.help-figure { margin: 0; padding: 9px; border: 1px solid #e3e7ec; border-radius: 13px; background: #f8fbfa; }
.help-figure img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid #e7eaee; }
.help-figure figcaption { margin-top: 8px; color: #667085; font-size: 10.5px; line-height: 1.55; }
.help-rule-box { margin-top: 9px; padding: 12px 13px; border: 1px solid #e3e7ec; border-radius: 11px; background: #fbfdfc; }
.help-rule-box > strong { display: block; margin-bottom: 5px; color: #344054; font-size: 11.5px; }
.help-rule-box p { font-size: 11.5px; }
.help-callout { margin-top: 10px !important; padding: 10px 12px; border-radius: 10px; background: #fff7ee; color: #8a6840 !important; }
.help-modal-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 20px; border-top: 1px solid #eef1f4; background: #fbfdfc; }
.help-modal-foot span { color: #8a94a3; font-size: 10.5px; }
.primary-button { min-height: 38px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--primary); color: white; font-size: 12px; font-weight: 800; cursor: pointer; }
.primary-button:hover { background: var(--primary-dark); }
footer strong { color: #667085; font-weight: 800; }

/* 가독성 강화: 작은 보조문구도 13px 이상으로 유지하고 대비를 높입니다. */
.ghost-button, .hero-kicker, .download-tabs > div, .section-heading p, .notice, .result-topline { font-size: 14px; }
.path-heading-row h2 { font-size: 19px; }
.path-badge, .section-step, .upload-number, .verdict, .rounding-warning, .metric span, .formula-card strong,
.detail-row, .rule-line, .criteria-toggle strong, .criteria-body h3, .help-section p, .help-path,
.help-file-grid strong, .help-rule-box > strong, .help-rule-box p, .primary-button { font-size: 13px; }
.breadcrumb, .drop-zone strong, .result-summary, summary strong { font-size: 15px; }
.upload-card h3, .help-section h3 { font-size: 17px; }
.upload-card-head p, .drop-zone > span, .status-ok strong, .status-ok span:last-child, .privacy-note,

  <script>
const OPERATING_INCOME_ITEMS = [
  '학교운영비전입금',
  '사용료',
  '수수료',
  '자산매각대',
  '지난년도수입',
  '이자수입',
  '기타행정활동수입',
  '순세계잉여금',
];

const GENERAL_EXPENSE_CODE = 'B200101';

function normalizeText(value) {
  return String(value ?? '')
    .replace(/[\n\r\t]/g, '')
    .replace(/\s+/g, '')
    .replace(/[·ㆍ]/g, '·')
    .trim();
}

function toWon(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return Math.round(value);
  if (value === null || value === undefined || value === '') return 0;
  const normalized = String(value)
    .replace(/,/g, '')
    .replace(/원/g, '')
    .replace(/\s+/g, '')
    .trim();
  if (!normalized) return 0;
  const parsed = Number(normalized);
  if (!Number.isFinite(parsed)) {
    throw new Error(`금액을 숫자로 읽지 못했습니다: ${value}`);
  }
  return Math.round(parsed);
}

function formatWon(value) {
  return `${Math.round(value).toLocaleString('ko-KR')}원`;
}

function formatSmallWon(value) {
  const n = Math.round(value);
  if (n === 0) return '';
  if (n % 1000 === 0 && n < 10000) return `${n / 1000}천원`;
  if (n % 100 === 0 && n < 1000) return `${n / 100}백원`;
  if (n % 10 === 0 && n < 100) return `${n / 10}십원`;
  return `${n.toLocaleString('ko-KR')}원`;
}

function formatKoreanMoney(value) {
  const n = Math.max(0, Math.round(value));
  if (n === 0) return '0원';

  const eok = Math.floor(n / 100000000);
  const afterEok = n % 100000000;
  const man = Math.floor(afterEok / 10000);
  const rest = afterEok % 10000;
  const parts = [];

  if (eok > 0) parts.push(`${eok.toLocaleString('ko-KR')}억`);
  if (man > 0) parts.push(`${man.toLocaleString('ko-KR')}만`);
  const restText = formatSmallWon(rest);
  if (restText) parts.push(restText);

  return parts.join(' ');
}

function calculateStatus(operatingBudget, generalExpense) {
  const denominator = Math.round(operatingBudget);
  const numerator = Math.round(generalExpense);

  if (!Number.isFinite(denominator) || denominator <= 0) {
    throw new Error('학교운영경비가 0원이거나 올바른 숫자가 아닙니다.');
  }
  if (!Number.isFinite(numerator) || numerator < 0) {
    throw new Error('일반업무추진비가 올바른 숫자가 아닙니다.');
  }

  // 업로드된 예산액을 기준으로 3% 산출액을 정수 금액으로 계산합니다.
  const maxAllowed = Math.floor((denominator * 3) / 100);
  const isCompliant = numerator <= maxAllowed;
  const difference = isCompliant ? maxAllowed - numerator : numerator - maxAllowed;
  const ratio = (numerator / denominator) * 100;

  return {
    operatingBudget: denominator,
    generalExpense: numerator,
    maxAllowed,
    isCompliant,
    difference,
    ratio,
  };
}


function findHeaderRow(rows, requiredHeaders) {
  return rows.findIndex((row) => {
    const normalized = (row || []).map(normalizeText);
    return requiredHeaders.every((header) => normalized.includes(normalizeText(header)));
  });
}

function headerMap(row) {
  const map = new Map();
  (row || []).forEach((cell, index) => {
    const key = normalizeText(cell);
    if (key && !map.has(key)) map.set(key, index);
  });
  return map;
}

function getIndex(map, aliases) {
  for (const alias of aliases) {
    const idx = map.get(normalizeText(alias));
    if (idx !== undefined) return idx;
  }
  return -1;
}

function classifyRows(rows) {
  const incomeHeader = findHeaderRow(rows, ['원가통계비목', '예산액']);
  const expenseHeader = findHeaderRow(rows, ['세출목', '원가통계비목명', '예산액']);

  if (expenseHeader >= 0) return { type: 'expense', headerRow: expenseHeader };
  if (incomeHeader >= 0) return { type: 'income', headerRow: incomeHeader };
  return { type: 'unknown', headerRow: -1 };
}

function extractIncome(rows) {
  const headerRow = findHeaderRow(rows, ['원가통계비목', '예산액']);
  if (headerRow < 0) {
    throw new Error('세입실적 파일에서 원가통계비목과 예산액 열을 찾지 못했습니다.');
  }

  const map = headerMap(rows[headerRow]);
  const nameIndex = getIndex(map, ['원가통계비목', '원가통계비목명']);
  const codeIndex = getIndex(map, ['원가통계비목코드', '원가통계비목 코드']);
  const budgetIndex = getIndex(map, ['예산액']);

  if (nameIndex < 0 || budgetIndex < 0) {
    throw new Error('세입실적 파일의 필요한 열을 찾지 못했습니다.');
  }

  const targets = new Map(OPERATING_INCOME_ITEMS.map((name) => [name, 0]));
  const matched = new Map(OPERATING_INCOME_ITEMS.map((name) => [name, 0]));

  for (let i = headerRow + 1; i < rows.length; i += 1) {
    const row = rows[i] || [];
    const name = normalizeText(row[nameIndex]);
    if (!name || name === '합계') continue;
    if (!targets.has(name)) continue;

    const amount = toWon(row[budgetIndex]);
    targets.set(name, targets.get(name) + amount);
    matched.set(name, matched.get(name) + 1);
  }

  const total = [...targets.values()].reduce((sum, value) => sum + value, 0);
  if (total <= 0) {
    throw new Error('세입실적 파일에서 학교운영경비 항목을 찾지 못했거나 합계가 0원입니다.');
  }

  return {
    total,
    items: OPERATING_INCOME_ITEMS.map((name) => ({
      name,
      amount: targets.get(name),
      matchedRows: matched.get(name),
    })),
    meta: {
      headerRow,
      nameIndex,
      codeIndex,
      budgetIndex,
    },
  };
}

function extractExpense(rows) {
  const headerRow = findHeaderRow(rows, ['세출목', '원가통계비목명', '예산액']);
  if (headerRow < 0) {
    throw new Error('성질별 세출실적 파일에서 필요한 열을 찾지 못했습니다.');
  }

  const map = headerMap(rows[headerRow]);
  const seMokIndex = getIndex(map, ['세출목']);
  const detailIndex = getIndex(map, ['세출세목명']);
  const nameIndex = getIndex(map, ['원가통계비목명', '원가통계비목']);
  const codeIndex = getIndex(map, ['원가통계비목코드', '원가통계비목 코드']);
  const budgetIndex = getIndex(map, ['예산액']);

  if (nameIndex < 0 || budgetIndex < 0) {
    throw new Error('성질별 세출실적 파일의 원가통계비목명 또는 예산액 열을 찾지 못했습니다.');
  }

  let amount = 0;
  let matchedRows = 0;
  let fallbackRows = 0;

  for (let i = headerRow + 1; i < rows.length; i += 1) {
    const row = rows[i] || [];
    const code = codeIndex >= 0 ? normalizeText(row[codeIndex]).toUpperCase() : '';
    const name = normalizeText(row[nameIndex]);
    const seMok = seMokIndex >= 0 ? normalizeText(row[seMokIndex]) : '';
    const detail = detailIndex >= 0 ? normalizeText(row[detailIndex]) : '';

    const codeMatch = code === GENERAL_EXPENSE_CODE;
    const nameFallback =
      !code &&
      seMok === '업무추진비' &&
      detail === '일반업무추진비' &&
      name === '일반업무추진비';

    if (!codeMatch && !nameFallback) continue;

    amount += toWon(row[budgetIndex]);
    matchedRows += 1;
    if (nameFallback) fallbackRows += 1;
  }

  if (matchedRows === 0) {
    throw new Error('성질별 세출실적 파일에서 일반업무추진비(B200101)를 찾지 못했습니다.');
  }

  return {
    amount,
    matchedRows,
    fallbackRows,
    meta: {
      headerRow,
      seMokIndex,
      detailIndex,
      nameIndex,
      codeIndex,
      budgetIndex,
    },
  };
}

const resultSection = document.querySelector('#resultSection');
const messageArea = document.querySelector('#messageArea');

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function rowsFromWorkbook(workbook) {
  const preferred = workbook.SheetNames.find((name) => /집행실적/.test(name));
  const orderedNames = preferred
    ? [preferred, ...workbook.SheetNames.filter((name) => name !== preferred)]
    : workbook.SheetNames;

  let best = null;
  for (const sheetName of orderedNames) {
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
      header: 1,
      raw: true,
      defval: null,
      blankrows: false,
    });
    const classification = classifyRows(rows);
    if (classification.type !== 'unknown') {
      return { rows, sheetName, classification };
    }
    if (!best && rows.length) best = { rows, sheetName, classification };
  }
  return best;
}

let xlsxLoaderPromise = null;

function ensureXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoaderPromise) return xlsxLoaderPromise;

  xlsxLoaderPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    script.async = true;
    script.onload = () => window.XLSX
      ? resolve(window.XLSX)
      : reject(new Error('엑셀 읽기 기능을 초기화하지 못했습니다.'));
    script.onerror = () => reject(new Error('엑셀 읽기 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.'));
    document.head.appendChild(script);
  });
  return xlsxLoaderPromise;
}

async function parseFile(file) {
  const XLSX = await ensureXLSX();
  const buffer = await file.arrayBuffer();
  let workbook;
  try {
    workbook = XLSX.read(buffer, { type: 'array', cellDates: false, dense: false });
  } catch (error) {
    const text = String(error?.message || error);
    if (/password|encrypted|encryption/i.test(text)) {
      throw new Error('암호가 설정된 엑셀 파일은 읽을 수 없습니다. 암호를 해제한 뒤 다시 저장해주세요.');
    }
    throw new Error('엑셀 파일을 읽지 못했습니다. 파일이 손상되지 않았는지 확인해주세요.');
  }

  const parsed = rowsFromWorkbook(workbook);
  if (!parsed || !parsed.rows?.length) {
    throw new Error('빈 엑셀 파일이거나 읽을 수 있는 데이터가 없습니다.');
  }

  if (parsed.classification.type === 'unknown') {
    throw new Error('집행실적 세입실적 또는 성질별 세출실적 형식으로 판별하지 못했습니다.');
  }

  if (parsed.classification.type === 'income') {
    return {
      type: 'income',
      file,
      sheetName: parsed.sheetName,
      data: extractIncome(parsed.rows),
    };
  }

  return {
    type: 'expense',
    file,
    sheetName: parsed.sheetName,
    data: extractExpense(parsed.rows),
  };
}

function setStatus(type) {
  const el = document.querySelector(`[data-status="${type}"]`);
  const item = state[type];
  if (!item) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `
    <div class="status-ok">
      <span class="status-check">✓</span>
      <div>
        <strong>${type === 'income' ? '세입실적 파일 확인됨' : '세출실적 파일 확인됨'}</strong>
        <span title="${escapeHtml(item.file.name)}">${escapeHtml(item.file.name)}</span>
      </div>
    </div>
  `;
}

function showMessage(message, kind = 'info') {
  messageArea.innerHTML = message
    ? `<div class="notice ${kind}">${escapeHtml(message)}</div>`

function clearMessage() {

function parseBudgetInput(value) {
  const digits = String(value || '').replace(/[^0-9]/g, '');
  if (!digits) return 0;
  return Number(digits);
}

function formatBudgetInput(value) {
  const amount = parseBudgetInput(value);
  return amount ? amount.toLocaleString('ko-KR') : '';
}

function wireBudgetEditControls() {
  const openButton = document.querySelector('#budgetEditButton');
  const closeButton = document.querySelector('#budgetEditClose');
  const input = document.querySelector('#budgetOverrideInput');
  const applyButton = document.querySelector('#applyBudgetOverride');
  const resetButton = document.querySelector('#resetBudgetOverride');
  const errorEl = document.querySelector('#budgetEditError');

  if (!openButton) return;

  openButton.addEventListener('click', () => {
    state.budgetEditPanelOpen = !state.budgetEditPanelOpen;
    renderResults();
    if (state.budgetEditPanelOpen) {
      requestAnimationFrame(() => {
        const nextInput = document.querySelector('#budgetOverrideInput');
        nextInput?.focus();
        nextInput?.select();
      });
    }
  });

  closeButton?.addEventListener('click', () => {
    state.budgetEditPanelOpen = false;
    renderResults();
  });

  input?.addEventListener('input', () => {
    const cursorAtEnd = input.selectionStart === input.value.length;
    input.value = formatBudgetInput(input.value);
    if (cursorAtEnd) input.setSelectionRange(input.value.length, input.value.length);
    if (errorEl) errorEl.textContent = '';
  });

  input?.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') applyButton?.click();
  });

  applyButton?.addEventListener('click', () => {
    const amount = parseBudgetInput(input?.value);
    if (!Number.isFinite(amount) || amount <= 0) {
      if (errorEl) errorEl.textContent = '수정된 학교운영경비 금액을 입력해 주세요.';
      input?.focus();
      return;
    }
    state.operatingBudgetOverride = Math.round(amount);
    state.budgetEditPanelOpen = true;
    renderResults();
  });

  resetButton?.addEventListener('click', () => {
    state.operatingBudgetOverride = null;
    state.budgetEditPanelOpen = true;
    renderResults();
  });
}

async function handleFile(file, intendedSlot) {
  if (!file) return;
  clearMessage();

  const ext = file.name.toLowerCase().split('.').pop();
  if (!['xlsx', 'xls'].includes(ext)) {
    showMessage('엑셀 파일(.xlsx 또는 .xls)을 올려주세요.', 'error');
    return;
  }

  const dropZone = document.querySelector(`[data-drop="${intendedSlot}"]`);
  dropZone.classList.add('is-loading');

  try {
    const parsed = await parseFile(file);
    state[parsed.type] = parsed;
    if (parsed.type === 'income') {
      state.operatingBudgetOverride = null;
      state.budgetEditPanelOpen = false;
    }
    setStatus(parsed.type);

    if (parsed.type !== intendedSlot) {
      showMessage(
        parsed.type === 'income'
          ? '세입실적 파일로 자동 판별해 왼쪽에 등록했습니다.'
          : '성질별 세출실적 파일로 자동 판별해 오른쪽에 등록했습니다.',
        'info',
      );
    }

    renderResults();
  } catch (error) {
    showMessage(error.message || '파일 처리 중 오류가 발생했습니다.', 'error');
  } finally {
    dropZone.classList.remove('is-loading');
  }
}

document.querySelectorAll('.drop-zone').forEach((zone) => {
  const slot = zone.dataset.drop;
  const input = zone.querySelector('input[type="file"]');

  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      input.click();
    }
  });
  input.addEventListener('change', () => handleFile(input.files?.[0], slot));

  ['dragenter', 'dragover'].forEach((eventName) => {
    zone.addEventListener(eventName, (event) => {
      event.preventDefault();
      zone.classList.add('is-dragging');
    });
  });
  ['dragleave', 'drop'].forEach((eventName) => {
    zone.addEventListener(eventName, (event) => {
      event.preventDefault();
      zone.classList.remove('is-dragging');
    });
  });
  zone.addEventListener('drop', (event) => handleFile(event.dataTransfer.files?.[0], slot));
});

document.querySelector('#resetButton').addEventListener('click', () => {
  state.income = null;
  state.expense = null;
  state.operatingBudgetOverride = null;
  state.budgetEditPanelOpen = false;
  document.querySelectorAll('input[type="file"]').forEach((input) => { input.value = ''; });
  setStatus('income');
  setStatus('expense');
  clearMessage();
  renderResults();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const criteriaToggle = document.querySelector('#criteriaToggle');
const criteriaBody = document.querySelector('#criteriaBody');
criteriaToggle.addEventListener('click', () => {
  const expanded = criteriaToggle.getAttribute('aria-expanded') === 'true';
  criteriaToggle.setAttribute('aria-expanded', String(!expanded));
  criteriaBody.hidden = expanded;
});

const helpModal = document.querySelector('#helpModal');
const helpButton = document.querySelector('#helpButton');
const helpCloseButton = document.querySelector('#helpCloseButton');
const helpConfirmButton = document.querySelector('#helpConfirmButton');

function openHelp() {
  helpModal.classList.remove('is-hidden');
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => helpCloseButton.focus());
}

function closeHelp() {
  helpModal.classList.add('is-hidden');
  document.body.classList.remove('modal-open');
  helpButton.focus();
}

helpButton.addEventListener('click', openHelp);
helpCloseButton.addEventListener('click', closeHelp);
helpConfirmButton.addEventListener('click', closeHelp);
helpModal.addEventListener('click', (event) => {
  if (event.target === helpModal) closeHelp();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !helpModal.classList.contains('is-hidden')) closeHelp();
});

  </script>
</body>
