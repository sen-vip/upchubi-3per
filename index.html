  <style>
:root {
  font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: #f3f5f8; color: var(--text); font-size: 16px; }

.page-shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 36px; }

.brand-mark { width: 35px; height: 35px; color: var(--primary); }
.ghost-button { min-height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,.78); color: #475467; font-size: 13px; font-weight: 700; cursor: pointer; }
.ghost-button:hover { border-color: #cbd3dc; background: white; }

main { padding-top: 56px; }
.hero { max-width: 720px; margin-bottom: 30px; }
.hero-kicker { margin-bottom: 12px; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; }

.path-card { display: grid; grid-template-columns: 44px 1fr; gap: 17px; margin: 0 0 38px; padding: 22px 24px; border: 1px solid var(--border); border-radius: 18px; background: linear-gradient(135deg, #f8faff, #ffffff); box-shadow: 0 4px 16px rgba(15, 23, 42, .035); }

.path-icon svg, .drop-icon svg, .privacy-note svg, .criteria-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.path-heading-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
.path-heading-row h2 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
.download-help-link { margin-left: auto; min-height: 32px; padding: 0 4px; border: 0; border-radius: 8px; background: transparent; color: var(--primary); font-size: 12.5px; font-weight: 800; cursor: pointer; text-decoration: none; transition: color .16s ease, background .16s ease; }
.download-help-link:hover { color: var(--primary-dark); background: var(--soft); }
.download-help-link:focus-visible { outline: 2px solid rgba(49, 89, 216, .32); outline-offset: 2px; }
.path-badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; background: #e8edff; color: var(--primary-dark); font-size: 11px; font-weight: 800; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 10px; color: #667085; font-size: 14px; line-height: 1.7; }

.download-tabs { display: flex; gap: 10px 24px; flex-wrap: wrap; margin-top: 13px; }

.input-mode-tabs {

}

}

}

}

}

.upload-section { padding-top: 2px; }

.section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }

.upload-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.upload-card { padding: 18px; border: 1px solid #e7eaf0; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }

.message-area { margin-top: 14px; }

.notice.error { border-color: #efd0cd; background: #fff7f6; color: #a1433d; }
.notice.info { border-color: #d9e1fb; background: #f7f9ff; color: #3f5f59; }

.result-section { scroll-margin-top: 16px; margin-top: 52px; }
.is-hidden { display: none !important; }
.result-heading { margin-bottom: 18px; }
.result-hero { position: relative; padding: 26px 28px 24px; border: 1px solid #e7eaf0; border-radius: 20px; background: linear-gradient(145deg, #ffffff 0%, #fafbfc 100%); box-shadow: 0 14px 36px rgba(15, 23, 42, .065); overflow: hidden; }

.result-topline { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; color: #667085; font-size: 13px; font-weight: 800; }

.result-ratio { position: relative; z-index: 1; margin-top: 14px; color: var(--primary-dark); font-size: clamp(56px, 8vw, 78px); line-height: 1; font-weight: 850; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.over .result-ratio { color: #a63f39; }
.result-ratio small { margin-left: 6px; font-size: .37em; font-weight: 800; letter-spacing: -.02em; }
.result-summary { position: relative; z-index: 1; margin: 13px 0 21px; color: #667085; font-size: 14px; line-height: 1.62; word-break: keep-all; overflow-wrap: normal; }

.progress-wrap { position: relative; z-index: 1; max-width: 620px; }
.progress-track { position: relative; height: 8px; border-radius: 999px; background: #e7ebef; overflow: hidden; }
.progress-fill { height: 100%; border-radius: inherit; background: var(--primary); }
.over .progress-fill { background: var(--danger); }
.progress-labels { display: flex; justify-content: space-between; margin-top: 7px; color: #8b95a5; font-size: 10px; font-variant-numeric: tabular-nums; }
.rounding-warning { position: relative; z-index: 1; margin: 13px 0 0; padding-top: 12px; border-top: 1px solid #f0d9d7; color: #9b4b45; font-size: 12px; line-height: 1.55; }

.metrics-card { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; padding: 6px 0; border: 1px solid #e7eaf0; border-radius: 16px; background: #fff; }
.metric { min-width: 0; padding: 18px 22px; border-right: 1px solid #eef1f4; }
.metric:last-child { border-right: 0; }
.metric span { display: block; color: #667085; font-size: 12px; font-weight: 700; }
.metric strong { display: block; margin-top: 7px; color: #344054; font-size: clamp(18px, 2.3vw, 24px); letter-spacing: -.035em; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric small { display: block; margin-top: 4px; color: #7a8594; font-size: 11px; text-align: right; }

.formula-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; padding: 13px 16px; border-radius: 12px; background: #f3f5f8; color: #667085; }

.details-stack { display: grid; gap: 10px; margin-top: 22px; }
details { border: 1px solid #e7eaf0; border-radius: 14px; background: #fff; overflow: hidden; }

.summary-action { flex: 0 0 auto; color: var(--primary); font-size: 11px; font-weight: 800; }

.detail-body { padding: 0 18px 18px; border-top: 1px solid #eef1f4; }

.result-guidance {

<body>
  <div id="app"></div>
  <script>
const OPERATING_INCOME_ITEMS = [
  '학교운영비전입금',
  '사용료',
  '수수료',
  '자산매각대',
  '지난년도수입',
  '이자수입',
  '기타행정활동수입',
  '순세계잉여금',
];

const GENERAL_EXPENSE_CODE = 'B200101';

function normalizeText(value) {
  return String(value ?? '')
    .replace(/[\n\r\t]/g, '')
    .replace(/\s+/g, '')
    .replace(/[·ㆍ]/g, '·')
    .trim();
}

function toWon(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return Math.round(value);
  if (value === null || value === undefined || value === '') return 0;
  const normalized = String(value)
    .replace(/,/g, '')
    .replace(/원/g, '')
    .replace(/\s+/g, '')
    .trim();
  if (!normalized) return 0;
  const parsed = Number(normalized);
  if (!Number.isFinite(parsed)) {
    throw new Error(`금액을 숫자로 읽지 못했습니다: ${value}`);
  }
  return Math.round(parsed);
}

function formatWon(value) {
  return `${Math.round(value).toLocaleString('ko-KR')}원`;
}

function formatSmallWon(value) {
  const n = Math.round(value);
  if (n === 0) return '';
  if (n % 1000 === 0 && n < 10000) return `${n / 1000}천원`;
  if (n % 100 === 0 && n < 1000) return `${n / 100}백원`;
  if (n % 10 === 0 && n < 100) return `${n / 10}십원`;
  return `${n.toLocaleString('ko-KR')}원`;
}

function formatKoreanMoney(value) {
  const n = Math.max(0, Math.round(value));
  if (n === 0) return '0원';

  const eok = Math.floor(n / 100000000);
  const afterEok = n % 100000000;
  const man = Math.floor(afterEok / 10000);
  const rest = afterEok % 10000;
  const parts = [];

  if (eok > 0) parts.push(`${eok.toLocaleString('ko-KR')}억`);
  if (man > 0) parts.push(`${man.toLocaleString('ko-KR')}만`);
  const restText = formatSmallWon(rest);
  if (restText) parts.push(restText);

  return parts.join(' ');
}

function calculateStatus(operatingBudget, generalExpense) {
  const denominator = Math.round(operatingBudget);
  const numerator = Math.round(generalExpense);

  if (!Number.isFinite(denominator) || denominator <= 0) {
    throw new Error('학교운영경비가 0원이거나 올바른 숫자가 아닙니다.');
  }
  if (!Number.isFinite(numerator) || numerator < 0) {
    throw new Error('일반업무추진비가 올바른 숫자가 아닙니다.');
  }

  // 업로드된 예산액을 기준으로 3% 산출액을 정수 금액으로 계산합니다.
  const maxAllowed = Math.floor((denominator * 3) / 100);
  const isCompliant = numerator <= maxAllowed;
  const difference = isCompliant ? maxAllowed - numerator : numerator - maxAllowed;
  const ratio = (numerator / denominator) * 100;

  return {
    operatingBudget: denominator,
    generalExpense: numerator,
    maxAllowed,
    isCompliant,
    difference,
    ratio,
  };
}


function findHeaderRow(rows, requiredHeaders) {
  return rows.findIndex((row) => {
    const normalized = (row || []).map(normalizeText);
    return requiredHeaders.every((header) => normalized.includes(normalizeText(header)));
  });
}

function headerMap(row) {
  const map = new Map();
  (row || []).forEach((cell, index) => {
    const key = normalizeText(cell);
    if (key && !map.has(key)) map.set(key, index);
  });
  return map;
}

function getIndex(map, aliases) {
  for (const alias of aliases) {
    const idx = map.get(normalizeText(alias));
    if (idx !== undefined) return idx;
  }
  return -1;
}

function classifyRows(rows) {
  const incomeHeader = findHeaderRow(rows, ['원가통계비목', '예산액']);
  const expenseHeader = findHeaderRow(rows, ['세출목', '원가통계비목명', '예산액']);

  if (expenseHeader >= 0) return { type: 'expense', headerRow: expenseHeader };
  if (incomeHeader >= 0) return { type: 'income', headerRow: incomeHeader };
  return { type: 'unknown', headerRow: -1 };
}

function extractIncome(rows) {
  const headerRow = findHeaderRow(rows, ['원가통계비목', '예산액']);
  if (headerRow < 0) {
    throw new Error('세입실적 파일에서 원가통계비목과 예산액 열을 찾지 못했습니다.');
  }

  const map = headerMap(rows[headerRow]);
  const nameIndex = getIndex(map, ['원가통계비목', '원가통계비목명']);
  const codeIndex = getIndex(map, ['원가통계비목코드', '원가통계비목 코드']);
  const budgetIndex = getIndex(map, ['예산액']);

  if (nameIndex < 0 || budgetIndex < 0) {
    throw new Error('세입실적 파일의 필요한 열을 찾지 못했습니다.');
  }

  const targets = new Map(OPERATING_INCOME_ITEMS.map((name) => [name, 0]));
  const matched = new Map(OPERATING_INCOME_ITEMS.map((name) => [name, 0]));

  for (let i = headerRow + 1; i < rows.length; i += 1) {
    const row = rows[i] || [];
    const name = normalizeText(row[nameIndex]);
    if (!name || name === '합계') continue;
    if (!targets.has(name)) continue;

    const amount = toWon(row[budgetIndex]);
    targets.set(name, targets.get(name) + amount);
    matched.set(name, matched.get(name) + 1);
  }

  const total = [...targets.values()].reduce((sum, value) => sum + value, 0);
  if (total <= 0) {
    throw new Error('세입실적 파일에서 학교운영경비 항목을 찾지 못했거나 합계가 0원입니다.');
  }

  return {
    total,
    items: OPERATING_INCOME_ITEMS.map((name) => ({
      name,
      amount: targets.get(name),
      matchedRows: matched.get(name),
    })),
    meta: {
      headerRow,
      nameIndex,
      codeIndex,
      budgetIndex,
    },
  };
}

function extractExpense(rows) {
  const headerRow = findHeaderRow(rows, ['세출목', '원가통계비목명', '예산액']);
  if (headerRow < 0) {
    throw new Error('성질별 세출실적 파일에서 필요한 열을 찾지 못했습니다.');
  }

  const map = headerMap(rows[headerRow]);
  const seMokIndex = getIndex(map, ['세출목']);
  const detailIndex = getIndex(map, ['세출세목명']);
  const nameIndex = getIndex(map, ['원가통계비목명', '원가통계비목']);
  const codeIndex = getIndex(map, ['원가통계비목코드', '원가통계비목 코드']);
  const budgetIndex = getIndex(map, ['예산액']);

  if (nameIndex < 0 || budgetIndex < 0) {
    throw new Error('성질별 세출실적 파일의 원가통계비목명 또는 예산액 열을 찾지 못했습니다.');
  }

  let amount = 0;
  let matchedRows = 0;
  let fallbackRows = 0;

  for (let i = headerRow + 1; i < rows.length; i += 1) {
    const row = rows[i] || [];
    const code = codeIndex >= 0 ? normalizeText(row[codeIndex]).toUpperCase() : '';
    const name = normalizeText(row[nameIndex]);
    const seMok = seMokIndex >= 0 ? normalizeText(row[seMokIndex]) : '';
    const detail = detailIndex >= 0 ? normalizeText(row[detailIndex]) : '';

    const codeMatch = code === GENERAL_EXPENSE_CODE;
    const nameFallback =
      !code &&
      seMok === '업무추진비' &&
      detail === '일반업무추진비' &&
      name === '일반업무추진비';

    if (!codeMatch && !nameFallback) continue;

    amount += toWon(row[budgetIndex]);
    matchedRows += 1;
    if (nameFallback) fallbackRows += 1;
  }

  if (matchedRows === 0) {
    throw new Error('성질별 세출실적 파일에서 일반업무추진비(B200101)를 찾지 못했습니다.');
  }

  return {
    amount,
    matchedRows,
    fallbackRows,
    meta: {
      headerRow,
      seMokIndex,
      detailIndex,
      nameIndex,
      codeIndex,
      budgetIndex,
    },
  };
}

const resultSection = document.querySelector('#resultSection');
const messageArea = document.querySelector('#messageArea');

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function rowsFromWorkbook(workbook) {
  const preferred = workbook.SheetNames.find((name) => /집행실적/.test(name));
  const orderedNames = preferred
    ? [preferred, ...workbook.SheetNames.filter((name) => name !== preferred)]
    : workbook.SheetNames;

  let best = null;
  for (const sheetName of orderedNames) {
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
      header: 1,
      raw: true,
      defval: null,
      blankrows: false,
    });
    const classification = classifyRows(rows);
    if (classification.type !== 'unknown') {
      return { rows, sheetName, classification };
    }
    if (!best && rows.length) best = { rows, sheetName, classification };
  }
  return best;
}

let xlsxLoaderPromise = null;

function ensureXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoaderPromise) return xlsxLoaderPromise;

  xlsxLoaderPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    script.async = true;
    script.onload = () => window.XLSX
      ? resolve(window.XLSX)
      : reject(new Error('엑셀 읽기 기능을 초기화하지 못했습니다.'));
    script.onerror = () => reject(new Error('엑셀 읽기 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.'));
    document.head.appendChild(script);
  });
  return xlsxLoaderPromise;
}

async function parseFile(file) {
  const XLSX = await ensureXLSX();
  const buffer = await file.arrayBuffer();
  let workbook;
  try {
    workbook = XLSX.read(buffer, { type: 'array', cellDates: false, dense: false });
  } catch (error) {
    const text = String(error?.message || error);
    if (/password|encrypted|encryption/i.test(text)) {
      throw new Error('암호가 설정된 엑셀 파일은 읽을 수 없습니다. 암호를 해제한 뒤 다시 저장해주세요.');
    }
    throw new Error('엑셀 파일을 읽지 못했습니다. 파일이 손상되지 않았는지 확인해주세요.');
  }

  const parsed = rowsFromWorkbook(workbook);
  if (!parsed || !parsed.rows?.length) {
    throw new Error('빈 엑셀 파일이거나 읽을 수 있는 데이터가 없습니다.');
  }

  if (parsed.classification.type === 'unknown') {
    throw new Error('집행실적 세입실적 또는 성질별 세출실적 형식으로 판별하지 못했습니다.');
  }

  if (parsed.classification.type === 'income') {
    return {
      type: 'income',
      file,
      sheetName: parsed.sheetName,
      data: extractIncome(parsed.rows),
    };
  }

  return {
    type: 'expense',
    file,
    sheetName: parsed.sheetName,
    data: extractExpense(parsed.rows),
  };
}

function setStatus(type) {
  const el = document.querySelector(`[data-status="${type}"]`);
  const item = state[type];
  if (!item) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `
    <div class="status-ok">
      <span class="status-check">✓</span>
      <div>
        <strong>${type === 'income' ? '세입실적 파일 확인됨' : '세출실적 파일 확인됨'}</strong>
        <span title="${escapeHtml(item.file.name)}">${escapeHtml(item.file.name)}</span>
      </div>
    </div>
  `;
}

function showMessage(message, kind = 'info') {
  messageArea.innerHTML = message
    ? `<div class="notice ${kind}">${escapeHtml(message)}</div>`
    : '';
}

function clearMessage() {
  showMessage('');
}

function renderResults() {
  const isManualMode = state.inputMode === 'manual';
  if (isManualMode) {
    if (state.manualOperatingBudget === null || state.manualGeneralExpense === null) {
      resultSection.classList.add('is-hidden');
      resultSection.innerHTML = '';
      return;
    }
  } else if (!state.income || !state.expense) {
    resultSection.classList.add('is-hidden');
    resultSection.innerHTML = '';
    return;
  }

  const baseOperatingBudget = isManualMode
    ? Math.round(state.manualOperatingBudget)
    : Math.round(state.income.data.total);
  const baseGeneralExpense = isManualMode
    ? Math.round(state.manualGeneralExpense)
    : Math.round(state.expense.data.amount);
  const effectiveIncomeItems = isManualMode
    ? []
    : state.income.data.items.map((item) => {
        const hasOverride = Object.prototype.hasOwnProperty.call(state.operatingIncomeOverrides, item.name);
        return {
          ...item,
          originalAmount: Math.round(item.amount),
          amount: hasOverride ? Math.round(state.operatingIncomeOverrides[item.name]) : Math.round(item.amount),
          isEdited: hasOverride,
        };
      });
  const effectiveOperatingBudget = isManualMode
    ? baseOperatingBudget
    : effectiveIncomeItems.reduce((sum, item) => sum + item.amount, 0);
  const effectiveGeneralExpense = isManualMode
    ? baseGeneralExpense
    : (state.generalExpenseOverride ?? baseGeneralExpense);

  let result;
  try {
    result = calculateStatus(effectiveOperatingBudget, effectiveGeneralExpense);

    return;

function parseBudgetInput(value) {
  const digits = String(value || '').replace(/[^0-9]/g, '');
  if (!digits) return 0;
  return Number(digits);
}

function formatBudgetInput(value) {
  const digits = String(value || '').replace(/[^0-9]/g, '');
  if (!digits) return '';
  return Number(digits).toLocaleString('ko-KR');
}

function wireBudgetEditControls() {
  const budgetOpenButton = document.querySelector('#budgetEditButton');
  const operatingDetails = document.querySelector('#operatingBudgetDetails');
  const incomeEditButtons = document.querySelectorAll('[data-income-edit-index]');
  const incomeEditInput = document.querySelector('#incomeItemEditInput');
  const incomeApplyButton = document.querySelector('#applyIncomeItemEdit');
  const incomeCancelButton = document.querySelector('#cancelIncomeItemEdit');
  const incomeResetAllButton = document.querySelector('#resetIncomeOverrides');
  const incomeErrorEl = document.querySelector('#incomeItemEditError');

  const expenseOpenButton = document.querySelector('#expenseEditButton');
  const expenseCloseButton = document.querySelector('#expenseEditClose');
  const expenseInput = document.querySelector('#expenseOverrideInput');
  const expenseApplyButton = document.querySelector('#applyExpenseOverride');
  const expenseResetButton = document.querySelector('#resetExpenseOverride');
  const expenseErrorEl = document.querySelector('#expenseEditError');

  const wireFormattedInput = (input, errorEl) => {
    input?.addEventListener('input', () => {
      const cursorAtEnd = input.selectionStart === input.value.length;
      input.value = formatBudgetInput(input.value);
      if (cursorAtEnd) input.setSelectionRange(input.value.length, input.value.length);
      if (errorEl) errorEl.textContent = '';
    });
  };

  operatingDetails?.addEventListener('toggle', () => {
    state.operatingDetailsOpen = operatingDetails.open;
  });

  budgetOpenButton?.addEventListener('click', () => {
    state.operatingDetailsOpen = true;
    state.incomeEditItemIndex = null;
    state.expenseEditPanelOpen = false;
    renderResults();
    requestAnimationFrame(() => {
      document.querySelector('#operatingBudgetDetails')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  incomeEditButtons.forEach((button) => {
    button.addEventListener('click', () => {
      const index = Number(button.dataset.incomeEditIndex);
      if (!Number.isInteger(index) || !state.income?.data?.items?.[index]) return;
      state.operatingDetailsOpen = true;
      state.incomeEditItemIndex = index;
      state.expenseEditPanelOpen = false;
      renderResults();
      requestAnimationFrame(() => {
        const nextInput = document.querySelector('#incomeItemEditInput');
        nextInput?.focus();
        nextInput?.select();
        nextInput?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  });

  wireFormattedInput(incomeEditInput, incomeErrorEl);
  incomeEditInput?.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') incomeApplyButton?.click();
    if (event.key === 'Escape') incomeCancelButton?.click();
  });

  incomeApplyButton?.addEventListener('click', () => {
    const index = state.incomeEditItemIndex;
    const item = Number.isInteger(index) ? state.income?.data?.items?.[index] : null;
    const hasAmountInput = /[0-9]/.test(incomeEditInput?.value || '');
    const amount = parseBudgetInput(incomeEditInput?.value);

    if (!item || !hasAmountInput || !Number.isFinite(amount) || amount < 0) {
      if (incomeErrorEl) incomeErrorEl.textContent = '0원 이상 금액을 입력해 주세요.';
      incomeEditInput?.focus();
      return;
    }

    const nextOverrides = { ...state.operatingIncomeOverrides };
    if (Math.round(amount) === Math.round(item.amount)) {
      delete nextOverrides[item.name];
    } else {
      nextOverrides[item.name] = Math.round(amount);
    }

    const nextTotal = state.income.data.items.reduce((sum, sourceItem) => {
      const hasOverride = Object.prototype.hasOwnProperty.call(nextOverrides, sourceItem.name);
      return sum + (hasOverride ? nextOverrides[sourceItem.name] : Math.round(sourceItem.amount));
    }, 0);

    if (nextTotal <= 0) {
      if (incomeErrorEl) incomeErrorEl.textContent = '학교운영경비 합계는 0원보다 커야 합니다.';
      incomeEditInput?.focus();
      return;
    }

    state.operatingIncomeOverrides = nextOverrides;
    state.incomeEditItemIndex = null;
    state.operatingDetailsOpen = true;
    renderResults();
  });

  incomeCancelButton?.addEventListener('click', () => {
    state.incomeEditItemIndex = null;
    state.operatingDetailsOpen = true;
    renderResults();
  });

  incomeResetAllButton?.addEventListener('click', () => {
    state.operatingIncomeOverrides = {};
    state.incomeEditItemIndex = null;
    state.operatingDetailsOpen = true;
    renderResults();
  });

  expenseOpenButton?.addEventListener('click', () => {
    state.expenseEditPanelOpen = !state.expenseEditPanelOpen;
    state.incomeEditItemIndex = null;
    renderResults();
    if (state.expenseEditPanelOpen) {
      requestAnimationFrame(() => {
        const nextInput = document.querySelector('#expenseOverrideInput');
        nextInput?.focus();
        nextInput?.select();
      });
    }
  });

  expenseCloseButton?.addEventListener('click', () => {
    state.expenseEditPanelOpen = false;
    renderResults();
  });

  wireFormattedInput(expenseInput, expenseErrorEl);
  expenseInput?.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') expenseApplyButton?.click();
  });
  expenseApplyButton?.addEventListener('click', () => {
    const hasAmountInput = /[0-9]/.test(expenseInput?.value || '');
    const amount = parseBudgetInput(expenseInput?.value);
    if (!hasAmountInput || !Number.isFinite(amount) || amount < 0) {
      if (expenseErrorEl) expenseErrorEl.textContent = '수정된 일반업무추진비 금액을 입력해 주세요.';
      expenseInput?.focus();
      return;
    }
    state.generalExpenseOverride = Math.round(amount);
    state.expenseEditPanelOpen = true;
    renderResults();
  });
  expenseResetButton?.addEventListener('click', () => {
    state.generalExpenseOverride = null;
    state.expenseEditPanelOpen = true;
    renderResults();
  });
}

async function handleFile(file, intendedSlot) {
  if (!file) return;
  clearMessage();

  const ext = file.name.toLowerCase().split('.').pop();
  if (!['xlsx', 'xls'].includes(ext)) {
    showMessage('엑셀 파일(.xlsx 또는 .xls)을 올려주세요.', 'error');
    return;
  }

  const dropZone = document.querySelector(`[data-drop="${intendedSlot}"]`);
  dropZone.classList.add('is-loading');

  try {
    const parsed = await parseFile(file);
    state[parsed.type] = parsed;
    if (parsed.type === 'income') {
      state.operatingIncomeOverrides = {};
      state.incomeEditItemIndex = null;
      state.operatingDetailsOpen = false;
    }
    if (parsed.type === 'expense') {
      state.generalExpenseOverride = null;
      state.expenseEditPanelOpen = false;
    }
    setStatus(parsed.type);

    if (parsed.type !== intendedSlot) {
      showMessage(
        parsed.type === 'income'
          ? '세입실적 파일로 자동 판별해 왼쪽에 등록했습니다.'
          : '성질별 세출실적 파일로 자동 판별해 오른쪽에 등록했습니다.',
        'info',
      );
    }

    renderResults();
  } catch (error) {
    showMessage(error.message || '파일 처리 중 오류가 발생했습니다.', 'error');
  } finally {
    dropZone.classList.remove('is-loading');
  }
}

document.querySelectorAll('.drop-zone').forEach((zone) => {
  const slot = zone.dataset.drop;
  const input = zone.querySelector('input[type="file"]');

  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      input.click();
    }
  });
  input.addEventListener('change', () => handleFile(input.files?.[0], slot));

  ['dragenter', 'dragover'].forEach((eventName) => {
    zone.addEventListener(eventName, (event) => {
      event.preventDefault();
      zone.classList.add('is-dragging');
    });
  });
  ['dragleave', 'drop'].forEach((eventName) => {
    zone.addEventListener(eventName, (event) => {
      event.preventDefault();
      zone.classList.remove('is-dragging');
    });
  });
  zone.addEventListener('drop', (event) => handleFile(event.dataTransfer.files?.[0], slot));
});

  input.addEventListener('input', () => {

manualCalculateButton.addEventListener('click', () => {
  const operatingText = manualOperatingBudgetInput.value;
  const expenseText = manualGeneralExpenseInput.value;
  const operating = parseBudgetInput(operatingText);
  const expense = parseBudgetInput(expenseText);

  if (!/[0-9]/.test(operatingText) || operating <= 0) {
    manualError.textContent = '학교운영경비를 입력해 주세요.';
    manualOperatingBudgetInput.focus();
    return;
  }
  if (!/[0-9]/.test(expenseText)) {
    manualError.textContent = '일반업무추진비를 입력해 주세요.';
    manualGeneralExpenseInput.focus();
    return;
  }

  state.manualOperatingBudget = operating;
  state.manualGeneralExpense = expense;
  manualError.textContent = '';
  renderResults();
});

manualClearButton.addEventListener('click', () => {
  manualOperatingBudgetInput.value = '';
  manualGeneralExpenseInput.value = '';
  state.manualOperatingBudget = null;
  state.manualGeneralExpense = null;
  manualError.textContent = '';
  renderResults();
});

[manualOperatingBudgetInput, manualGeneralExpenseInput].forEach((input) => {
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') manualCalculateButton.click();
  });
});

syncInputModeUI();


document.querySelector('#resetButton').addEventListener('click', () => {
  state.income = null;
  state.expense = null;
  state.operatingIncomeOverrides = {};
  state.incomeEditItemIndex = null;
  state.operatingDetailsOpen = false;
  state.generalExpenseOverride = null;
  state.expenseEditPanelOpen = false;
  state.inputMode = 'file';
  state.manualOperatingBudget = null;
  state.manualGeneralExpense = null;
  manualOperatingBudgetInput.value = '';
  manualGeneralExpenseInput.value = '';
  manualError.textContent = '';
  syncInputModeUI();
  document.querySelectorAll('input[type="file"]').forEach((input) => { input.value = ''; });
  setStatus('income');
  setStatus('expense');
  clearMessage();
  renderResults();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const criteriaToggle = document.querySelector('#criteriaToggle');
const criteriaBody = document.querySelector('#criteriaBody');
criteriaToggle.addEventListener('click', () => {
  const expanded = criteriaToggle.getAttribute('aria-expanded') === 'true';
  criteriaToggle.setAttribute('aria-expanded', String(!expanded));
  criteriaBody.hidden = expanded;
});

const helpModal = document.querySelector('#helpModal');
const helpButton = document.querySelector('#helpButton');
const downloadHelpButton = document.querySelector('#downloadHelpButton');
const helpCloseButton = document.querySelector('#helpCloseButton');
const helpConfirmButton = document.querySelector('#helpConfirmButton');
let helpReturnFocus = helpButton;

function openHelp(targetId = null, opener = helpButton) {
  helpReturnFocus = opener || helpButton;
  helpModal.classList.remove('is-hidden');
  document.body.classList.add('modal-open');

  requestAnimationFrame(() => {
    if (!targetId) {
      helpCloseButton.focus();
      return;
    }

    const target = document.getElementById(targetId);
    const targetHeading = document.getElementById('helpDownloadTitle');
    if (target) {
      target.scrollIntoView({ block: 'start', behavior: 'smooth' });
      target.classList.add('help-target-focus');
      window.setTimeout(() => target.classList.remove('help-target-focus'), 900);
    }
    if (targetHeading) targetHeading.focus({ preventScroll: true });
  });
}

function closeHelp() {
  helpModal.classList.add('is-hidden');
  document.body.classList.remove('modal-open');
  if (helpReturnFocus && typeof helpReturnFocus.focus === 'function') helpReturnFocus.focus();
}

helpButton.addEventListener('click', () => openHelp(null, helpButton));
downloadHelpButton.addEventListener('click', () => openHelp('help-download-files', downloadHelpButton));
helpCloseButton.addEventListener('click', closeHelp);
helpConfirmButton.addEventListener('click', closeHelp);
helpModal.addEventListener('click', (event) => {
  if (event.target === helpModal) closeHelp();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !helpModal.classList.contains('is-hidden')) closeHelp();
});

  </script>
</body>
</html>
